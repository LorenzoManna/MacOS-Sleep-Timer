[project]
name = "macos-sleep-timer"
version = "0.1.1"
description = "A sleek, modern macOS application and menu bar tray tool for scheduling system sleep and hibernation."
authors = [
    { name = "Lorenzo Manna" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "rumps>=0.4.0",
    "pyobjc-framework-Cocoa>=9.0",
]

[project.scripts]
sleeptimer = "sleeptimer_build:run_app"
build-app = "sleeptimer_build:build"

[tool.poetry]
packages = [
    { include = "sleeptimer_build.py" }
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=4.1.0"
flake8 = ">=7.0.0"
black = ">=24.0.0"
isort = ">=5.13.0"
mypy = ">=1.9.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
